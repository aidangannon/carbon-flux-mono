name: CI Pipeline

on:
  push:
    branches: [ trunk ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pantsbuild/actions/init-pants@v8
        with:
          named-caches-hash: ${{ hashFiles('python-default.lock') }}
      - name: Lint and type check with Pants
        run: |
          pants lint check \
            --changed-since=HEAD~1 \
            --changed-dependents=transitive \
      - name: Test with Pants
        run: |
          pants test \
            --changed-since=HEAD~1 \
            --changed-dependents=transitive \
      - name: Build with Pants
        run: |
          pants package \
            --changed-since=HEAD~1 \
            --changed-dependents=transitive \
      - name: Check for build artifacts
        id: check-artifacts
        run: |
          if [ -d dist ] && [ "$(ls -A dist)" ]; then
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload build artifacts
        if: steps.check-artifacts.outputs.has_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: dist/
    outputs:
      has_artifacts: ${{ steps.check-artifacts.outputs.has_artifacts }}
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.has_artifacts == 'true'
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pantsbuild/actions/init-pants@v8
        with:
          named-caches-hash: ${{ hashFiles('python-default.lock') }}
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: dist/
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - name: Terraform Deploy
        env:
          TF_VAR_icos_username: ${{ secrets.ICOS_USERNAME }}
          TF_VAR_icos_password: ${{ secrets.ICOS_PASSWORD }}
          TF_VAR_aws_region: eu-west-2
          TF_VAR_python_runtime: python3.12
          TF_VAR_klayers_runtime: p312
          TF_VAR_workspace_root: ${{ github.workspace }}
        run: |
          pants experimental-deploy \
            --changed-since=HEAD~1 \
            --changed-dependents=transitive \
            --download-terraform-args="-auto-approve" \
