name: CI Pipeline

on:
  push:
    branches: [ trunk ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pantsbuild/actions/init-pants@v8
        with:
          named-caches-hash: ${{ hashFiles('python-default.lock') }}
      - name: Test with Pants
        run: |
          pants test \
            --changed-since=HEAD~1 \
            --changed-dependents=transitive \
      - name: Build with Pants
        run: |
          pants package \
            --changed-since=HEAD~1 \
            --changed-dependents=transitive \
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: dist/
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: dist/
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Deploy
        env:
          TF_VAR_icos_username: ${{ secrets.ICOS_USERNAME }}
          TF_VAR_icos_password: ${{ secrets.ICOS_PASSWORD }}
        run: |
          pants experimental-deploy \
            --changed-since=HEAD~1 \
            --changed-dependents=transitive \
            --download-terraform-args="-auto-approve -var=aws_region=eu-west-2 -var=python_runtime=python3.12" \
